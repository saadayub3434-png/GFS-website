<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GFS Article | Global Financial Services</title>

    <style>
        :root {
            --ink: #111111;
            --orange: #f36f21;
            --off: #f7f7f5;
            --muted: #666666;
            --line: #dddddd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background: var(--off);
            line-height: 1.7;
        }

        .wrap {
            max-width: 1100px;
            margin: auto;
            padding: 0 24px;
        }

        /* HEADER */

        header {
            background: white;
            border-bottom: 1px solid var(--line);
            padding: 18px 0;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-img {
            height: 75px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
        }

        .back-link {
            color: var(--ink);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--orange);
        }

        /* ARTICLE */

        .article-page {
            padding: 70px 0 100px;
        }

        .article-header {
            max-width: 850px;
            margin: 0 auto 40px;
        }

        .category {
            color: var(--orange);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .article-header h1 {
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
            margin: 0 0 22px;
            letter-spacing: -1.5px;
        }

        .article-meta {
            color: var(--muted);
            font-size: 15px;
        }

        .featured-image {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            display: block;
            margin: 40px 0 50px;
        }

        .article-content {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 50px;
        }

        .article-excerpt {
            font-size: 21px;
            line-height: 1.6;
            font-weight: 600;
            margin: 0 0 35px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--line);
        }

        .article-content p {
            font-size: 18px;
            margin: 0 0 24px;
        }

        .article-content h2 {
            font-size: 30px;
            margin: 45px 0 18px;
            line-height: 1.2;
        }

        .article-content h3 {
            font-size: 23px;
            margin: 35px 0 15px;
        }

        .article-content ul,
        .article-content ol {
            margin: 0 0 25px 25px;
            font-size: 18px;
        }

        .article-content li {
            margin-bottom: 10px;
        }

        .article-content blockquote {
            border-left: 4px solid var(--orange);
            padding: 10px 25px;
            margin: 30px 0;
            color: var(--muted);
            font-size: 19px;
        }

        .message {
            max-width: 850px;
            margin: 80px auto;
            text-align: center;
            font-size: 18px;
        }

        /* FOOTER */

        footer {
            background: var(--ink);
            color: white;
            padding: 45px 0;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .footer-logo {
            height: 34px;
            width: auto;
        }

        .footer-text {
            color: #bbbbbb;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .header-inner {
                gap: 20px;
            }

            .logo-img {
                height: 60px;
            }

            .article-page {
                padding: 45px 0 70px;
            }

            .article-content {
                padding: 30px 22px;
            }

            .article-content p,
            .article-content ul,
            .article-content ol {
                font-size: 17px;
            }

            .article-excerpt {
                font-size: 19px;
            }

            .footer-inner {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="wrap header-inner">

        <a href="../index.html">
            <img
                src="../logo.png"
                alt="GFS — Global Financial Services"
                class="logo-img"
            >
        </a>

        <a href="../index.html#insights" class="back-link">
            ← Back to Insights
        </a>

    </div>
</header>


<main class="article-page">

    <div class="wrap">

        <div id="loadingMessage" class="message">
            Loading article...
        </div>

        <article id="articlePage" style="display:none;">

            <div class="article-header">

                <div id="articleCategory" class="category"></div>

                <h1 id="articleTitle"></h1>

                <div id="articleMeta" class="article-meta"></div>

            </div>

            <img
                id="featuredImage"
                class="featured-image"
                style="display:none;"
                alt=""
            >

            <div class="article-content">

                <div id="articleExcerpt" class="article-excerpt"></div>

                <div id="articleContent"></div>

            </div>

        </article>

    </div>

</main>


<footer>

    <div class="wrap footer-inner">

        <img
            src="../logo.png"
            alt="GFS — Global Financial Services"
            class="footer-logo"
        >

        <div class="footer-text">
            © 2026 Global Financial Services. All rights reserved.
        </div>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script>

async function loadArticle() {

    const loadingMessage = document.getElementById("loadingMessage");
    const articlePage = document.getElementById("articlePage");

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    if (!slug) {

        loadingMessage.textContent = "Article not found.";
        return;
    }

    try {

        const { data, error } = await window.supabaseClient
            .from("articles")
            .select("*")
            .eq("slug", slug)
            .eq("status", "published")
            .single();

        if (error || !data) {

            console.error("Article error:", error);

            loadingMessage.textContent = "Article not found.";
            return;
        }


        /* CATEGORY */

        document.getElementById("articleCategory").textContent =
            data.category || "GFS Insights";


        /* TITLE */

        document.getElementById("articleTitle").textContent =
            data.title || "GFS Article";


        /* AUTHOR + DATE */

        let meta = data.author || "GFS Team";

        if (data.published_at) {

            const date = new Date(data.published_at).toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

            meta += " · " + date;
        }

        document.getElementById("articleMeta").textContent = meta;


        /* FEATURED IMAGE */

        if (data.featured_image) {

            const image = document.getElementById("featuredImage");

            image.src = data.featured_image;
            image.alt = data.title || "GFS Article";
            image.style.display = "block";
        }


        /* EXCERPT */

        const excerpt = document.getElementById("articleExcerpt");

        if (data.excerpt) {

            excerpt.textContent = data.excerpt;

        } else {

            excerpt.style.display = "none";
        }


        /* FULL ARTICLE CONTENT */

        document.getElementById("articleContent").innerHTML =
            formatArticleContent(data.content);


        /* SHOW ARTICLE */

        loadingMessage.style.display = "none";
        articlePage.style.display = "block";


        /* UPDATE BROWSER TITLE */

        document.title =
            data.title + " | GFS — Global Financial Services";

    } catch (error) {

        console.error(error);

        loadingMessage.textContent =
            "Unable to load this article.";

    }
}


/* FORMAT CONTENT */

function formatArticleContent(content) {

    if (!content) {
        return "<p>No article content available.</p>";
    }


    /*
       If content contains HTML formatting,
       display it as HTML.
    */

    if (
        content.includes("<p>") ||
        content.includes("<h2>") ||
        content.includes("<h3>") ||
        content.includes("<ul>") ||
        content.includes("<ol>")
    ) {

        return content;
    }


    /*
       If content is plain text,
       convert blank lines into paragraphs.
    */

    return content
        .trim()
        .split(/\n\s*\n/)
        .map(paragraph => {

            return "<p>" +
                escapeHtml(paragraph).replace(/\n/g, "<br>") +
                "</p>";

        })
        .join("");
}


/* SECURITY */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


document.addEventListener(
    "DOMContentLoaded",
    loadArticle
);

</script>

</body>
</html>
