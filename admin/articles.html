<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GFS Article Manager</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="admin-dashboard">

        <header class="dashboard-header">

            <div class="dashboard-brand">

                <img
                    src="../logo.png"
                    alt="GFS"
                    class="dashboard-logo"
                >

                <div>
                    <strong>GFS</strong>
                    <span>Article Manager</span>
                </div>

            </div>

            <div>

                <button id="dashboardButton">
                    Dashboard
                </button>

                <button id="logoutButton">
                    Logout
                </button>

            </div>

        </header>


        <main class="dashboard-main">

            <div class="page-heading">

                <div>
                    <h1>Articles</h1>

                    <p>
                        Manage GFS Insights and publications.
                    </p>
                </div>

                <button id="newArticleButton" class="primary-button">
                    + New Article
                </button>

            </div>


            <!-- Article Editor -->

            <section id="articleEditor" class="article-editor">

                <h2 id="editorTitle">
                    Create New Article
                </h2>


                <form id="articleForm">

                    <input
                        type="hidden"
                        id="articleId"
                    >


                    <div class="form-group">

                        <label for="title">
                            Article Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                            placeholder="Enter article title"
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select id="category" required>

                                <option value="">
                                    Select category
                                </option>

                                <option value="Audit">
                                    Audit
                                </option>

                                <option value="Tax">
                                    Tax
                                </option>

                                <option value="Advisory">
                                    Advisory
                                </option>

                                <option value="Risk">
                                    Risk
                                </option>

                                <option value="Finance">
                                    Finance
                                </option>

                                <option value="Regulatory">
                                    Regulatory
                                </option>

                                <option value="Business">
                                    Business
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="author">
                                Author
                            </label>

                            <input
                                type="text"
                                id="author"
                                placeholder="Author name"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="featuredImage">
                            Featured Image URL
                        </label>

                        <input
                            type="url"
                            id="featuredImage"
                            placeholder="https://example.com/image.jpg"
                        >

                    </div>


                    <div class="form-group">

                        <label for="excerpt">
                            Short Description
                        </label>

                        <textarea
                            id="excerpt"
                            rows="3"
                            placeholder="Short description shown on the Insights page"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="content">
                            Article Content
                        </label>

                        <textarea
                            id="content"
                            rows="15"
                            required
                            placeholder="Write your full article here..."
                        ></textarea>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="status">
                                Status
                            </label>

                            <select id="status">

                                <option value="draft">
                                    Draft
                                </option>

                                <option value="published">
                                    Published
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="publishedAt">
                                Publication Date
                            </label>

                            <input
                                type="datetime-local"
                                id="publishedAt"
                            >

                        </div>

                    </div>


                    <div class="editor-actions">

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Save Article
                        </button>

                        <button
                            type="button"
                            id="cancelButton"
                            class="secondary-button"
                        >
                            Cancel
                        </button>

                    </div>


                    <p id="articleMessage"></p>

                </form>

            </section>


            <!-- Existing Articles -->

            <section class="articles-list">

                <div class="section-header">

                    <h2>Existing Articles</h2>

                    <button id="refreshButton">
                        Refresh
                    </button>

                </div>

                <div id="articlesContainer">

                    <p>
                        Loading articles...
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="admin.js"></script>

</body>

</html>
